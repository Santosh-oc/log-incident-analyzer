apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "log-incident-analyzer.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "log-incident-analyzer.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "log-incident-analyzer.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "log-incident-analyzer.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            # DKubeX serves base-path apps under /<app-name>; the app must honour it.
            - name: DKUBEX_BASE_PATH
              value: "/{{ include "log-incident-analyzer.name" . }}"
            # The gateway authenticates users; the app enforces the header.
            - name: REQUIRE_AUTH
              value: "true"
            {{- if .Values.postgres }}
            - name: DATABASE_URL
              value: {{ .Values.postgres.db_url | quote }}
            {{- end }}
            {{- if .Values.minio }}
            - name: MINIO_ENDPOINT
              value: {{ .Values.minio.endpoint | quote }}
            - name: MINIO_ACCESS_KEY
              value: {{ .Values.minio.access_key | quote }}
            - name: MINIO_SECRET_KEY
              value: {{ .Values.minio.secret_key | quote }}
            - name: MINIO_BUCKET_LOGS
              value: {{ .Values.minio.bucket | quote }}
            {{- end }}
            {{- if .Values.llm }}
            - name: LLM_BASE_URL
              value: {{ .Values.llm.base_url | quote }}
            - name: LLM_MODEL
              value: {{ .Values.llm.model | quote }}
            {{- if .Values.llm.api_key }}
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "log-incident-analyzer.fullname" . }}-llm
                  key: api_key
            {{- end }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /{{ include "log-incident-analyzer.name" . }}/api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /{{ include "log-incident-analyzer.name" . }}/api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources: {{- toYaml .Values.resources | nindent 12 }}
